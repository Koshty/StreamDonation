<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f6f8; color: #333; text-align: center; }
    .checkmark { width: 80px; height: 80px; border-radius: 50%; display: inline-block; background: #4CAF50; position: relative; animation: pop 0.4s ease forwards; }
    .checkmark::after { content: ''; position: absolute; left: 28px; top: 15px; width: 20px; height: 40px; border-right: 4px solid white; border-bottom: 4px solid white; transform: rotate(45deg); }
    @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
    h1 { margin-top: 20px; font-size: 1.8em; }
    p { font-size: 1em; color: #555; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="checkmark"></div>
  <h1>Thank You for Your Donation!</h1>
  <p>Your support means a lot ❤️</p>
  <script>
    setTimeout(() => { window.close(); }, 10000);
  </script>
</body>
</html>

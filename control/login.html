<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Streamer Login</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    input, button { padding: 0.5rem; margin: 0.5rem 0; width: 100%; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>Streamer Login</h2>
  <form id="login-form" name="login" autocomplete="on">
    <!-- Prevents Chrome from misfilling wrong fields -->
    <input type="text" name="fake-username" style="display:none;" aria-hidden="true" />

    <input
      type="text"
      id="username"
      name="username"
      placeholder="Username"
      required
      autocomplete="username"
    />
    <input
      type="password"
      id="password"
      name="password"
      placeholder="Password"
      required
      autocomplete="current-password"
    />
    <button type="submit">Login</button>
    <p class="error" id="error-msg"></p>
  </form>

  <p>Don't have an account? <a href="/register">Register here</a></p>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Login failed.';
          return;
        }

        localStorage.setItem('token', data.token);
        window.location.href = `/control/`;
      } catch (err) {
        errorMsg.textContent = 'Something went wrong.';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Overlay Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      background: #111;
      color: white;
    }

    label {
      display: block;
      margin-top: 1rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      margin-top: 0.25rem;
    }

    button {
      padding: 0.5rem 1rem;
      margin-top: 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    #imagePreview {
      display: block;
      max-width: 200px;
      margin-top: 1rem;
      border-radius: 8px;
    }

    #status, #copyStatus {
      margin-top: 0.5rem;
      color: lightgreen;
    }

    #donation-history {
      max-height: 800px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .donation-card {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #555;
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
      word-break: break-word;
    }

    .donation-card img {
      height: 100px;
      width: auto;
      object-fit: contain;
      border-radius: 8px;
      margin-top: 6px;
      align-self: flex-start;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
  #clearShownBtn {
    background-color: #b00020;
    color: white;
    border: none;
    padding: 0.2rem 0.8rem; /* smaller padding */
    margin-top: 0;          /* remove extra margin */
    font-size: 0.95rem;     /* smaller font */
    cursor: pointer;
    border-radius: 4px;     /* slightly smaller radius */
    transition: background-color 0.2s ease-in-out;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  #clearShownBtn:hover {
    background-color: #d32f2f;
  }

  .filter-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 1rem;
}

.donation-card.paid {
  border: 2px solid gold;
  box-shadow: 0 0 10px gold;
}

</style>

</head>
<body>
  <h2>Overlay Control Panel</h2>

  <h3>🎥 OBS Browser Source Link</h3>
  <input type="text" id="obsLink" readonly />
  <button id="copyObsBtn">📋 Copy OBS Link</button>

  <h3>💸 Public Donation Link</h3>
  <input type="text" id="donateLink" readonly />
  <button id="copyDonateBtn">📋 Copy Donation Link</button>

  <p id="copyStatus"></p>

  <button onclick="logout()">Logout</button>

  <p id="streamer-display"></p>

  <button id="togglePause">Pause</button>

  <label for="imageUrl">Custom Image URL</label>
  <input type="text" id="imageUrl" placeholder="https://example.com/image.gif" />
  <img id="imagePreview" style="max-width: 100%; margin-top: 1rem;" />

  <label>
    <input type="checkbox" id="allowGifsToggle" />
    Allow GIFs
  </label>

  <label>
  <input type="checkbox" id="allowTTSToggle" />
  Enable TTS
</label>

<label>
  <input type="checkbox" id="freeModeToggle" />
  Free Mode (No Payment Required)
</label>

  <button id="saveImage">Save</button>
  <p id="status"></p>

  <div class="filter-actions">
  <label for="donationFilter"><strong>Filter:</strong></label>
  <select id="donationFilter">
    <option value="all">All</option>
    <option value="waiting">Waiting</option>
    <option value="shown">Shown</option>
  </select>

    <label for="paidFilter">Type:</label>
  <select id="paidFilter">
    <option value="all">All</option>
    <option value="paid">Paid</option>
    <option value="free">Free</option>
  </select>

  <button id="clearShownBtn">🗑️ Clear All Shown</button>
</div>


  <div id="donation-history"> </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="control.js"></script>
</body>
</html>

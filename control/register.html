<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Streamer Register</title>
  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/control/';
    }
  </script>
  <style>
    :root {
      --bg: #0e1013;
      --surface: #171a1f;
      --surface-2: #1f2329;
      --border: #2a2f37;
      --text: #f0f1f3;
      --text-muted: #9aa1ab;
      --accent: #5b8def;
      --accent-hover: #4a7bdb;
      --danger: #e5484d;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 380px;
    }
    h2 {
      margin: 0 0 1.5rem;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }
    .field { margin-bottom: 1.1rem; }
    input {
      width: 100%;
      padding: 0.6rem 0.7rem;
      font-size: 0.95rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      cursor: pointer;
      margin-top: 0.4rem;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin: 0.6rem 0 0;
      min-height: 1.1rem;
    }
    .switch-link {
      margin: 1.25rem 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }
    .switch-link a { color: var(--accent); text-decoration: none; }
    .switch-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h2>🎛️ Create Streamer Account</h2>
    <form id="register-form" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" required autocomplete="new-password" />
      </div>
      <button type="submit">Register</button>
      <p class="error" id="error-msg"></p>
    </form>

    <p class="switch-link">Already have an account? <a href="/">Login here</a></p>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';

      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, username })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Registration failed.';
          return;
        }

        // Save token + redirect to control panel
        localStorage.setItem('token', data.token);
        window.location.href = `/control/`;
      } catch (err) {
        errorMsg.textContent = 'Something went wrong.';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Send a Donation Message</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/overlay/donaterform.css" />
  <style>
    #giphyResults img.selected {
      outline: 3px solid #00ffcc;
    }
    .copy-row {
      display: flex;
      gap: 8px;
      margin-top: 0.25rem;
    }
    .copy-row input {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Send a Donation Message</h2>
    <form id="donation-form">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Anonymous" maxlength="25" />

      <label for="message">Message</label>
      <textarea id="message" placeholder="Your message" maxlength="360"></textarea>

      <div id="amount-section">
        <label for="amount">Amount (EGP)</label>
        <input type="number" id="amount" placeholder="e.g. 10" min="1" step="0.01" />
      </div>

      <div id="gif-section">
        <label for="giphySearch">Search GIFs</label>
        <input type="text" id="giphySearch" placeholder="Type to search GIFs" />
        <div id="giphyResults"></div>
      </div>

      <input type="hidden" id="imageUrl" />
      <div class="form-actions-row">
        <button type="submit">Send</button>
        <button id="clearGifBtn" type="button" style="display:none;">❌ Clear GIF</button>
      </div>
    </form>
    <p id="status"></p>

    <div id="instapay-panel" style="display:none;">
      <h3>Send your InstaPay transfer</h3>
      <p>Open your banking app and send an InstaPay transfer for <strong>exactly</strong> the amount below — don't round it, that's how we match your donation.</p>

      <label>Send exactly</label>
      <div class="copy-row">
        <input type="text" id="instapayAmount" readonly />
        <button type="button" id="copyAmountBtn">📋 Copy</button>
      </div>

      <label>To InstaPay ID / Mobile Number</label>
      <div class="copy-row">
        <input type="text" id="instapayIdField" readonly />
        <button type="button" id="copyIdBtn">📋 Copy</button>
      </div>

      <p id="instapayStatusText">⏳ Waiting for your payment to be confirmed...</p>
      <button type="button" id="instapayRetryBtn" style="display:none;">🔄 Try Again</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('s'); // ?s=streamername

    let overlayToken = '';
    let GIPHY_API_KEY = '';
    let allowGifs = true;
    let defaultImageUrl = '';
    let freeMode = true;

    const donationForm = document.getElementById('donation-form');
    const statusText = document.getElementById('status');
    const gifSection = document.getElementById('gif-section');
    const imageInput = document.getElementById('imageUrl');
    const clearGifBtn = document.getElementById('clearGifBtn');
    const giphySearchInput = document.getElementById('giphySearch');
    const giphyResults = document.getElementById('giphyResults');
    const amountSection = document.getElementById('amount-section');
    const amountInput = document.getElementById('amount');
    const messageInput = document.getElementById('message');

    function autoResizeMessage() {
      messageInput.style.height = 'auto';
      messageInput.style.height = messageInput.scrollHeight + 'px';
    }
    messageInput.addEventListener('input', autoResizeMessage);

    if (!username) {
      statusText.textContent = '❌ Invalid link. Streamer missing.';
      donationForm.style.display = 'none';
    } else {
      fetch(`/api/donations/resolve/${username}`)
        .then(res => {
          if (!res.ok) throw new Error('Streamer not found');
          return res.json();
        })
        .then(data => {
          overlayToken = data.overlayToken;

          return Promise.all([
            fetch(`/config/${username}`).then(res => res.json()),
            fetch('/env-config').then(res => res.json())
          ]);
        })
        .then(([config, env]) => {
          console.log('CONFIG:', config); // Add this line
          GIPHY_API_KEY = env.giphyKey;
          allowGifs = config.allowGifs;
          defaultImageUrl = config.defaultImageUrl;
          freeMode = config.freeMode === true;
          if (!allowGifs) gifSection.style.display = 'none';
          amountSection.style.display = freeMode ? 'none' : 'block';
        })
        .catch(err => {
          console.error('[Donation] Streamer resolution failed:', err);
          statusText.textContent = '❌ Invalid or expired link.';
          donationForm.style.display = 'none';
        });
    }

    let debounceTimeout;
    giphySearchInput.addEventListener('input', () => {
      clearTimeout(debounceTimeout);
      debounceTimeout = setTimeout(() => {
        const q = giphySearchInput.value.trim();
        if (!q || !GIPHY_API_KEY || !allowGifs) return;
        searchGiphy(q);
      }, 500);
    });

    async function searchGiphy(q) {
      const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(q)}&limit=9&rating=pg`);
      const data = await res.json();
      giphyResults.innerHTML = '';

      data.data.forEach(gif => {
        const img = document.createElement('img');
        img.src = gif.images.fixed_height_small.url;
        img.title = 'Click to use this GIF';
        img.onclick = () => {
          imageInput.value = gif.images.original.url;
          Array.from(giphyResults.children).forEach(imgEl => imgEl.classList.remove('selected'));
          img.classList.add('selected');
          clearGifBtn.style.display = 'inline-block';
        };
        giphyResults.appendChild(img);
      });
    }

    clearGifBtn.addEventListener('click', () => {
      imageInput.value = '';
      giphySearchInput.value = '';
      giphyResults.innerHTML = '';
      clearGifBtn.style.display = 'none';
    });

    donationForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!username || !overlayToken) {
        statusText.textContent = '❌ Streamer not resolved. Try again.';
        return;
      }

      const sender = document.getElementById('username').value.trim().slice(0, 25);
      const message = document.getElementById('message').value.trim().slice(0, 360);
      let imageUrl = imageInput.value.trim();
      let amount = 0;

      if (!imageUrl && defaultImageUrl) {
        imageUrl = defaultImageUrl;
      }

      if (!freeMode) {
        amount = parseFloat(amountInput.value);
        if (isNaN(amount) || amount < 1) {
          statusText.textContent = '❌ Please enter a valid amount.';
          return;
        }

        const res = await fetch('/api/instapay/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount,
            username: sender || 'Anonymous',
            message,
            imageUrl,
            streamer: username
          })
        });

        const data = await res.json();
        if (data.success) {
          showInstapayPanel(data);
        } else {
          statusText.textContent = '❌ ' + (data.error || 'Failed to start payment.');
        }
        return;
      }

      // Free mode validation: don't allow empty username + message
      if (!sender && !message) {
        statusText.textContent = '❌ Please enter a message.';
        return;
      }

      const res = await fetch('/api/donations/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: sender || 'Anonymous',
          message,
          imageUrl,
          streamer: username
        })
      });

      const data = await res.json();
      statusText.textContent =
        data.success ? (data.message || '✅ Message sent!') : '❌ ' + (data.error || 'Something went wrong.');
    });

    const instapayPanel = document.getElementById('instapay-panel');
    const instapayAmountField = document.getElementById('instapayAmount');
    const instapayIdField = document.getElementById('instapayIdField');
    const instapayStatusText = document.getElementById('instapayStatusText');
    const instapayRetryBtn = document.getElementById('instapayRetryBtn');
    let pollTimer = null;

    function copyField(fieldId) {
      const input = document.getElementById(fieldId);
      navigator.clipboard.writeText(input.value).catch(() => {});
    }
    document.getElementById('copyAmountBtn').addEventListener('click', () => copyField('instapayAmount'));
    document.getElementById('copyIdBtn').addEventListener('click', () => copyField('instapayIdField'));

    function showInstapayPanel(data) {
      donationForm.style.display = 'none';
      instapayPanel.style.display = 'block';
      instapayRetryBtn.style.display = 'none';
      instapayAmountField.value = `${data.reservedAmount} EGP`;
      instapayIdField.value = data.instapayId;
      instapayStatusText.textContent = '⏳ Waiting for your payment to be confirmed...';

      const expiresAt = new Date(data.expiresAt).getTime();
      pollTimer = setInterval(async () => {
        if (Date.now() > expiresAt) {
          stopPollingAsExpired();
          return;
        }
        try {
          const res = await fetch(`/api/instapay/status/${data.donationId}`);
          const statusData = await res.json();
          if (statusData.success && statusData.status === 'paid') {
            clearInterval(pollTimer);
            instapayStatusText.textContent = '✅ Thank you! Your donation is on its way to the stream.';
          } else if (statusData.success && statusData.status === 'expired') {
            stopPollingAsExpired();
          }
        } catch (err) {
          console.error('[InstaPay] Status poll failed:', err);
        }
      }, 4000);
    }

    function stopPollingAsExpired() {
      clearInterval(pollTimer);
      instapayStatusText.textContent = '⌛ This reservation expired before we saw your payment.';
      instapayRetryBtn.style.display = 'inline-block';
    }

    instapayRetryBtn.addEventListener('click', () => {
      instapayPanel.style.display = 'none';
      donationForm.style.display = 'block';
      statusText.textContent = '';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Send a Donation Message</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/overlay/donaterform.css" />
  <script src="https://accounts.google.com/gsi/client?hl=en" async defer onload="window.__gsiLoaded && window.__gsiLoaded()"></script>
  <style>
    #verifiedDonorInfo img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 8px;
    }
    #verifiedDonorInfo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.2rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 0.6rem;
      border-radius: 8px;
    }
    #verifiedDonorInfo button {
      margin-left: auto;
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
    }
    #requireVerifiedHint {
      color: var(--warning);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    #twitchSignInBtn {
      display: none;
      background: #9146FF;
      color: white;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    #twitchSignInBtn:hover {
      background: #7d2ff2;
    }
    #giphyResults img.selected {
      outline: 3px solid var(--accent);
    }
    .copy-row {
      display: flex;
      gap: 8px;
      margin-top: 0.25rem;
    }
    .copy-row input {
      flex: 1;
    }
    #instapay-panel {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }
    #instapay-panel h3 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
    }
    #instapayStatusText {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      vertical-align: -3px;
    }
    #status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    #status:empty { display: none; }
    #status.success { color: #3fb950; }
    #status.error { color: var(--danger); }
    #verifiedDonorInfo span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .form-actions-row button, .copy-row button, #instapayRetryBtn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Send a Donation Message</h2>
    <p id="requireVerifiedHint" style="display:none;">This streamer requires a verified sign-in to donate.</p>
    <div id="googleSignInBtn"></div>
    <button type="button" id="twitchSignInBtn">Sign in with Twitch</button>
    <div id="verifiedDonorInfo" style="display:none;">
      <img id="verifiedAvatar" src="" alt="" />
      <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#3fb950;"><polyline points="20 6 9 17 4 12"></polyline></svg> Verified as <strong id="verifiedName"></strong></span>
      <button type="button" id="signOutBtn">Not you?</button>
    </div>

    <form id="donation-form">
      <div id="username-field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Anonymous" maxlength="25" />
      </div>

      <label for="message">Message</label>
      <textarea id="message" placeholder="Your message" maxlength="360"></textarea>

      <div id="amount-section">
        <label for="amount" id="amountLabel">Amount (EGP)</label>
        <input type="number" id="amount" placeholder="e.g. 10" min="1" step="0.01" />
      </div>

      <div id="gif-section">
        <label for="giphySearch">Search GIFs</label>
        <input type="text" id="giphySearch" placeholder="Type to search GIFs" />
        <div id="giphyResults"></div>
      </div>

      <input type="hidden" id="imageUrl" />
      <div class="form-actions-row">
        <button type="submit">Send</button>
        <button id="clearGifBtn" type="button" style="display:none;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg> Clear GIF</button>
      </div>
    </form>
    <p id="status"></p>

    <div id="instapay-panel" style="display:none;">
      <h3>Send your InstaPay transfer</h3>
      <p>Open your banking app and send an InstaPay transfer for <strong>exactly</strong> the amount below — don't round it, that's how we match your donation.</p>

      <label>Send exactly</label>
      <div class="copy-row">
        <input type="text" id="instapayAmount" readonly />
        <button type="button" id="copyAmountBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy</button>
      </div>

      <label>To InstaPay ID / Mobile Number</label>
      <div class="copy-row">
        <input type="text" id="instapayIdField" readonly />
        <button type="button" id="copyIdBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy</button>
      </div>

      <p id="instapayStatusText"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Waiting for your payment to be confirmed...</p>
      <button type="button" id="instapayRetryBtn" style="display:none;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Try Again</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('s'); // ?s=streamername

    let overlayToken = '';
    let GIPHY_API_KEY = '';
    let GOOGLE_CLIENT_ID = '';
    let TWITCH_CLIENT_ID = '';
    let allowGifs = true;
    let defaultImageUrl = '';
    let donationMode = 'free'; // 'free' | 'optional' | 'paid'
    let requireVerifiedDonor = false;
    let authProvider = 'google';
    let donorToken = null;
    let verifiedName = null;

    const donationForm = document.getElementById('donation-form');
    const statusText = document.getElementById('status');
    const gifSection = document.getElementById('gif-section');
    const imageInput = document.getElementById('imageUrl');
    const clearGifBtn = document.getElementById('clearGifBtn');
    const giphySearchInput = document.getElementById('giphySearch');
    const giphyResults = document.getElementById('giphyResults');
    const amountSection = document.getElementById('amount-section');
    const amountInput = document.getElementById('amount');
    const amountLabel = document.getElementById('amountLabel');
    const messageInput = document.getElementById('message');
    const usernameField = document.getElementById('username-field');
    const requireVerifiedHint = document.getElementById('requireVerifiedHint');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const twitchSignInBtn = document.getElementById('twitchSignInBtn');
    const verifiedDonorInfo = document.getElementById('verifiedDonorInfo');
    const verifiedAvatar = document.getElementById('verifiedAvatar');
    const verifiedNameEl = document.getElementById('verifiedName');
    const signOutBtn = document.getElementById('signOutBtn');
    const submitBtn = donationForm.querySelector('button[type="submit"]');

    const ICON_PATHS = {
      check: '<polyline points="20 6 9 17 4 12"></polyline>',
      x: '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>',
      clock: '<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>'
    };
    function icon(name) {
      return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ''}</svg>`;
    }
    function setStatus(text, type) {
      statusText.className = type || '';
      statusText.innerHTML = text ? `${icon(type === 'error' ? 'x' : 'check')} ${text}` : '';
    }

    function autoResizeMessage() {
      messageInput.style.height = 'auto';
      messageInput.style.height = messageInput.scrollHeight + 'px';
    }
    messageInput.addEventListener('input', autoResizeMessage);

    const DONOR_TOKEN_STORAGE_KEY = `donorToken:${username || ''}`;

    function saveDonorToken(tok, name, picture) {
      try {
        sessionStorage.setItem(DONOR_TOKEN_STORAGE_KEY, JSON.stringify({ donorToken: tok, name, picture }));
      } catch (err) { /* storage unavailable, not fatal */ }
    }

    function loadSavedDonorToken() {
      try {
        const raw = sessionStorage.getItem(DONOR_TOKEN_STORAGE_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        // Decode (not verify — the server always re-verifies) just to check local expiry.
        const payload = JSON.parse(atob(saved.donorToken.split('.')[1]));
        if (payload.exp && payload.exp * 1000 < Date.now()) {
          sessionStorage.removeItem(DONOR_TOKEN_STORAGE_KEY);
          return null;
        }
        return saved;
      } catch (err) {
        return null;
      }
    }

    function clearSavedDonorToken() {
      try { sessionStorage.removeItem(DONOR_TOKEN_STORAGE_KEY); } catch (err) { /* ignore */ }
    }

    function updateSubmitState() {
      submitBtn.disabled = requireVerifiedDonor && !donorToken;
      submitBtn.style.opacity = submitBtn.disabled ? '0.5' : '1';
      // When verification is required, don't even show the form until signed in.
      donationForm.style.display = (requireVerifiedDonor && !donorToken) ? 'none' : 'block';
    }

    function initSignInUI() {
      if (!requireVerifiedDonor) return; // only show sign-in when it's actually needed
      if (authProvider === 'twitch') {
        twitchSignInBtn.style.display = 'inline-block';
      } else {
        tryInitGoogleSignIn();
      }
    }

    function tryInitGoogleSignIn() {
      if (authProvider !== 'google' || !requireVerifiedDonor) return;
      if (!GOOGLE_CLIENT_ID || typeof google === 'undefined' || !google.accounts) return;
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential
      });
      google.accounts.id.renderButton(googleSignInBtn, {
        theme: 'filled_blue',
        size: 'large',
        shape: 'pill',
        text: 'signin_with',
        locale: 'en'
      });
    }
    window.__gsiLoaded = tryInitGoogleSignIn;

    twitchSignInBtn.addEventListener('click', () => {
      if (!TWITCH_CLIENT_ID) {
        setStatus('Twitch sign-in is not configured for this streamer.', 'error');
        return;
      }
      const callbackUrl = `${window.location.origin}/overlay/twitch-callback.html`;
      const authorizeUrl = 'https://id.twitch.tv/oauth2/authorize'
        + `?client_id=${encodeURIComponent(TWITCH_CLIENT_ID)}`
        + `&redirect_uri=${encodeURIComponent(callbackUrl)}`
        + '&response_type=token&scope='
        + `&state=${encodeURIComponent(username)}`;
      window.location.href = authorizeUrl;
    });

    async function handleGoogleCredential(response) {
      try {
        const res = await fetch('/api/google/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential, streamer: username })
        });
        const data = await res.json();
        if (data.success) {
          donorToken = data.donorToken;
          verifiedName = data.name;
          saveDonorToken(data.donorToken, data.name, data.picture);
          showVerifiedState(data.name, data.picture);
        } else {
          donorToken = null;
          setStatus(data.error || 'Google sign-in failed.', 'error');
        }
      } catch (err) {
        console.error('[Google] verify failed:', err);
        setStatus('Google sign-in failed. Please try again.', 'error');
      }
      updateSubmitState();
    }

    function showVerifiedState(name, picture) {
      googleSignInBtn.style.display = 'none';
      twitchSignInBtn.style.display = 'none';
      usernameField.style.display = 'none';
      verifiedDonorInfo.style.display = 'flex';
      verifiedAvatar.src = picture || '';
      verifiedNameEl.textContent = name;
    }

    signOutBtn.addEventListener('click', () => {
      donorToken = null;
      verifiedName = null;
      clearSavedDonorToken();
      usernameField.style.display = 'block';
      verifiedDonorInfo.style.display = 'none';
      initSignInUI();
      updateSubmitState();
    });

    if (!username) {
      setStatus('Invalid link. Streamer missing.', 'error');
      donationForm.style.display = 'none';
    } else {
      fetch(`/api/donations/resolve/${username}`)
        .then(res => {
          if (!res.ok) throw new Error('Streamer not found');
          return res.json();
        })
        .then(data => {
          overlayToken = data.overlayToken;

          return Promise.all([
            fetch(`/config/${username}`).then(res => res.json()),
            fetch('/env-config').then(res => res.json())
          ]);
        })
        .then(([config, env]) => {
          console.log('CONFIG:', config); // Add this line
          GIPHY_API_KEY = env.giphyKey;
          GOOGLE_CLIENT_ID = env.googleClientId || '';
          TWITCH_CLIENT_ID = env.twitchClientId || '';
          allowGifs = config.allowGifs;
          defaultImageUrl = config.defaultImageUrl;
          donationMode = config.donationMode || 'free';
          requireVerifiedDonor = config.requireVerifiedDonor === true;
          authProvider = config.authProvider === 'twitch' ? 'twitch' : 'google';
          if (!allowGifs) gifSection.style.display = 'none';
          amountSection.style.display = donationMode === 'free' ? 'none' : 'block';
          if (donationMode === 'paid') {
            amountInput.required = true;
            amountLabel.textContent = 'Amount (EGP)';
            amountInput.placeholder = 'e.g. 10';
          } else if (donationMode === 'optional') {
            amountInput.required = false;
            amountLabel.textContent = 'Amount (EGP) — optional';
            amountInput.placeholder = 'Leave blank to donate for free';
          }
          requireVerifiedHint.style.display = requireVerifiedDonor ? 'block' : 'none';

          if (requireVerifiedDonor) {
            const saved = loadSavedDonorToken();
            if (saved) {
              donorToken = saved.donorToken;
              verifiedName = saved.name;
              showVerifiedState(saved.name, saved.picture);
            }
          }

          updateSubmitState();
          initSignInUI();
        })
        .catch(err => {
          console.error('[Donation] Streamer resolution failed:', err);
          setStatus('Invalid or expired link.', 'error');
          donationForm.style.display = 'none';
        });
    }

    let debounceTimeout;
    giphySearchInput.addEventListener('input', () => {
      clearTimeout(debounceTimeout);
      debounceTimeout = setTimeout(() => {
        const q = giphySearchInput.value.trim();
        if (!q || !GIPHY_API_KEY || !allowGifs) return;
        searchGiphy(q);
      }, 500);
    });

    async function searchGiphy(q) {
      const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(q)}&limit=9&rating=pg`);
      const data = await res.json();
      giphyResults.innerHTML = '';

      data.data.forEach(gif => {
        const img = document.createElement('img');
        img.src = gif.images.fixed_height_small.url;
        img.title = 'Click to use this GIF';
        img.onclick = () => {
          imageInput.value = gif.images.original.url;
          Array.from(giphyResults.children).forEach(imgEl => imgEl.classList.remove('selected'));
          img.classList.add('selected');
          clearGifBtn.style.display = 'inline-block';
        };
        giphyResults.appendChild(img);
      });
    }

    clearGifBtn.addEventListener('click', () => {
      imageInput.value = '';
      giphySearchInput.value = '';
      giphyResults.innerHTML = '';
      clearGifBtn.style.display = 'none';
    });

    donationForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitBtn.disabled) return; // guard against a double-click firing this twice

      submitBtn.disabled = true;
      const originalSubmitLabel = submitBtn.textContent;
      submitBtn.textContent = 'Sending...';

      try {
      if (!username || !overlayToken) {
        setStatus('Streamer not resolved. Try again.', 'error');
        return;
      }

      if (requireVerifiedDonor && !donorToken) {
        setStatus('Please sign in to donate.', 'error');
        return;
      }

      const sender = donorToken ? verifiedName : document.getElementById('username').value.trim().slice(0, 25);
      const message = document.getElementById('message').value.trim().slice(0, 360);
      let imageUrl = imageInput.value.trim();

      if (!imageUrl && defaultImageUrl) {
        imageUrl = defaultImageUrl;
      }

      const rawAmount = amountInput.value.trim();
      const parsedAmount = parseFloat(rawAmount);
      const hasValidAmount = rawAmount !== '' && !isNaN(parsedAmount) && parsedAmount >= 1;
      // 'paid' always pays; 'optional' pays only if the donor actually entered an amount.
      const wantsToPay = donationMode === 'paid' || (donationMode === 'optional' && hasValidAmount);

      if (wantsToPay) {
        if (!hasValidAmount) {
          setStatus('Please enter a valid amount.', 'error');
          return;
        }

        const res = await fetch('/api/instapay/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: parsedAmount,
            username: sender || 'Anonymous',
            message,
            imageUrl,
            streamer: username,
            donorToken
          })
        });

        const data = await res.json();
        if (data.success) {
          showInstapayPanel(data);
        } else {
          setStatus(data.error || 'Failed to start payment.', 'error');
        }
        return;
      }

      // Free path: donationMode === 'free', or 'optional' with no amount entered.
      if (!sender && !message) {
        setStatus('Please enter a message.', 'error');
        return;
      }

      const res = await fetch('/api/donations/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: sender || 'Anonymous',
          message,
          imageUrl,
          streamer: username,
          donorToken
        })
      });

      const data = await res.json();
      if (data.success) {
        setStatus(data.message || 'Message sent!', 'success');
        // Clear the form so a stray extra click can't resend the same content.
        document.getElementById('message').value = '';
        autoResizeMessage();
        amountInput.value = '';
        imageInput.value = '';
        giphySearchInput.value = '';
        giphyResults.innerHTML = '';
        clearGifBtn.style.display = 'none';
      } else {
        setStatus(data.error || 'Something went wrong.', 'error');
      }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalSubmitLabel;
      }
    });

    const instapayPanel = document.getElementById('instapay-panel');
    const instapayAmountField = document.getElementById('instapayAmount');
    const instapayIdField = document.getElementById('instapayIdField');
    const instapayStatusText = document.getElementById('instapayStatusText');
    const instapayRetryBtn = document.getElementById('instapayRetryBtn');
    let pollTimer = null;

    function copyField(fieldId) {
      const input = document.getElementById(fieldId);
      navigator.clipboard.writeText(input.value).catch(() => {});
    }
    document.getElementById('copyAmountBtn').addEventListener('click', () => copyField('instapayAmount'));
    document.getElementById('copyIdBtn').addEventListener('click', () => copyField('instapayIdField'));

    function showInstapayPanel(data) {
      donationForm.style.display = 'none';
      instapayPanel.style.display = 'block';
      instapayRetryBtn.style.display = 'none';
      instapayAmountField.value = `${data.reservedAmount} EGP`;
      instapayIdField.value = data.instapayId;
      instapayStatusText.innerHTML = `${icon('clock')} Waiting for your payment to be confirmed...`;

      const expiresAt = new Date(data.expiresAt).getTime();
      pollTimer = setInterval(async () => {
        if (Date.now() > expiresAt) {
          stopPollingAsExpired();
          return;
        }
        try {
          const res = await fetch(`/api/instapay/status/${data.donationId}`);
          const statusData = await res.json();
          if (statusData.success && statusData.status === 'paid') {
            clearInterval(pollTimer);
            instapayStatusText.innerHTML = `${icon('check')} Thank you! Your donation is on its way to the stream.`;
          } else if (statusData.success && statusData.status === 'expired') {
            stopPollingAsExpired();
          }
        } catch (err) {
          console.error('[InstaPay] Status poll failed:', err);
        }
      }, 4000);
    }

    function stopPollingAsExpired() {
      clearInterval(pollTimer);
      instapayStatusText.innerHTML = `${icon('x')} This reservation expired before we saw your payment.`;
      instapayRetryBtn.style.display = 'inline-block';
    }

    instapayRetryBtn.addEventListener('click', () => {
      instapayPanel.style.display = 'none';
      donationForm.style.display = 'block';
      statusText.textContent = '';
    });
  </script>
</body>
</html>
